<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem TPMS - Login Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f2fe">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Library QR Code & Scanner -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background-color: #0a0e17; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 30px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 20px; color: #00f0ff; margin-bottom: 20px; }
        .instruction { color: #9ca3af; font-size: 14px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 12px; background: #0d131f; border: 1px solid #00f0ff; border-radius: 8px; color: #00f0ff; font-family: 'Orbitron', sans-serif; font-size: 16px; text-align: center; margin-bottom: 15px; outline: none; }
        .btn { width: 100%; padding: 12px; background: #00f0ff; color: #0a0e17; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 15px; margin-top: 5px; }
        .btn-scan { background: #10b981; color: #fff; margin-bottom: 10px; }
        #qrcode { display: flex; justify-content: center; margin: 20px 0; background: #fff; padding: 15px; border-radius: 10px; }
        #reader { width: 100%; margin-top: 15px; border-radius: 10px; overflow: hidden; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo"><i class="fa-solid fa-truck-monster"></i> TPMS IOT ACCESS</div>

        <!-- TAMPILAN UNTUK PC / LAPTOP -->
        <div id="pc-section">
            <p class="instruction">Masukkan <b>Kod Unik Kenderaan</b> untuk log masuk atau imbas QR menggunakan telefon bimbit.</p>
            <input type="text" id="pc-code-input" placeholder="Contoh: TPMS-8821" value="TPMS-8821">
            <button class="btn" onclick="loginWithCodePC()">MASUK DASHBOARD</button>
            
            <hr style="border: 0.5px solid #1f2937; margin: 20px 0;">
            <p class="instruction" style="font-size:12px;">Atau imbas QR di bawah menggunakan telefon anda:</p>
            <div id="qrcode"></div>
        </div>

        <!-- TAMPILAN UNTUK PHONE -->
        <div id="mobile-section" class="hidden">
            <p class="instruction">Log masuk sistem TPMS melalui Telefon Bimbit.</p>
            <button class="btn btn-scan" onclick="startQRScanner()"><i class="fa-solid fa-qrcode"></i> IMBAS QR CODE</button>
            
            <div id="reader" class="hidden"></div>

            <p style="margin: 15px 0; color: #6b7280; font-size: 12px;">— ATAU MASUKKAN KOD —</p>
            
            <input type="text" id="mobile-code-input" placeholder="Kod Unik (cth: TPMS-8821)">
            <button class="btn" onclick="loginWithCodeMobile()">SAHKAN KOD</button>
        </div>
    </div>

    <!-- Panggil Skrip Logik Login -->
    <script src="script-login.js"></script>

    <!-- Pendaftaran Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js")
          .then(() => console.log("Service Worker Berjaya Didaftarkan!"))
          .catch((err) => console.log("SW Error:", err));
      }
    </script>
</body>
</html>
